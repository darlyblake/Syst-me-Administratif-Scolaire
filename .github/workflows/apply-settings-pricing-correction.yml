name: Apply settings pricing correction
on:
  push:
    branches: [main]
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch Settings pricing model
        shell: python
        run: |
          from pathlib import Path
          import re

          page = Path('app/ecole/settings/page.tsx')
          text = page.read_text(encoding='utf-8')

          # Establishment-wide registration/re-registration state.
          if 'fraisInscriptionEtablissement' not in text:
              anchor = 'const [pricing, setPricing] = useState<TarificationClasse[]>([])'
              addition = '''const [fraisInscriptionEtablissement, setFraisInscriptionEtablissement] = useState(0)\n  const [fraisReinscriptionEtablissement, setFraisReinscriptionEtablissement] = useState(0)'''
              if anchor not in text:
                  raise SystemExit('pricing state anchor not found')
              text = text.replace(anchor, anchor + '\n  ' + addition, 1)

          # Remove every per-level registration field from the Settings UI.
          text = re.sub(
              r'<div>\s*<Label>Frais d\'inscription[^<]*</Label>\s*<Input\s+type="number"\s+value=\{niveau\.fraisInscription\}.*?/>\s*</div>',
              '', text, flags=re.S)

          # Add the two establishment-wide fields immediately before the pricing-level map.
          if 'Frais de réinscription — établissement' not in text:
              global_ui = '''<div className="grid gap-4 md:grid-cols-2 mb-6">\n                <div>\n                  <Label>Frais d'inscription — établissement (FCFA)</Label>\n                  <Input\n                    type="number"\n                    value={fraisInscriptionEtablissement}\n                    onChange={(e) => setFraisInscriptionEtablissement(Number(e.target.value))}\n                    min="0"\n                  />\n                </div>\n                <div>\n                  <Label>Frais de réinscription — établissement (FCFA)</Label>\n                  <Input\n                    type="number"\n                    value={fraisReinscriptionEtablissement}\n                    onChange={(e) => setFraisReinscriptionEtablissement(Number(e.target.value))}\n                    min="0"\n                  />\n                </div>\n              </div>\n\n              '''
              pattern = r'(?m)^(\s*)\{[^\n]*tarificationTypesEcole[^\n]*\.map\('
              match = re.search(pattern, text)
              if not match:
                  raise SystemExit('tarification level map not found')
              indent = match.group(1)
              replacement = indent + global_ui.replace('\n', '\n' + indent) + match.group(0).lstrip()
              text = text[:match.start()] + replacement + text[match.end():]

          # New level/class forms: only tuition remains per level.
          text = re.sub(
              r'<div>\s*<Label>Frais d\'inscription</Label>\s*<Input[^>]*value=\{nouveauxNiveaux\[[^\]]+\]\?\.fraisInscription \?\? 0\}[^>]*/>\s*</div>',
              '', text, flags=re.S)
          text = re.sub(
              r'<div>\s*<Label>Frais d\'inscription</Label>\s*<Input[^>]*value=\{fraisInscriptionNouvelle\}[^>]*/>\s*</div>',
              '', text, flags=re.S)

          # No longer require registration fee when creating a level/class.
          text = text.replace(
              'nouveauNiveau.fraisInscription <= 0 || ',
              '',
              1,
          )
          text = text.replace(
              'nouvelleClasse.trim() && fraisInscriptionNouvelle > 0 && fraisScolariteAnnuelleNouvelle > 0',
              'nouvelleClasse.trim() && fraisScolariteAnnuelleNouvelle > 0',
              1,
          )
          text = text.replace(
              'fraisInscription: nouveauNiveau.fraisInscription,\n              fraisScolariteAnnuelle: nouveauNiveau.fraisScolariteAnnuelle',
              'fraisInscription: fraisInscriptionEtablissement,\n              fraisScolariteAnnuelle: nouveauNiveau.fraisScolariteAnnuelle',
              1,
          )
          text = text.replace(
              'fraisInscription: fraisInscriptionNouvelle,\n        fraisScolariteAnnuelle: fraisScolariteAnnuelleNouvelle',
              'fraisInscription: fraisInscriptionEtablissement,\n        fraisScolariteAnnuelle: fraisScolariteAnnuelleNouvelle',
              1,
          )

          # Persist the global amounts alongside existing localStorage settings without breaking legacy fields.
          save_marker = 'serviceParametres.sauvegarderTarification(pricing)'
          if save_marker in text:
              save_code = '''localStorage.setItem("fraisInscriptionEtablissement", String(fraisInscriptionEtablissement))\n    localStorage.setItem("fraisReinscriptionEtablissement", String(fraisReinscriptionEtablissement))\n    '''
              if 'localStorage.setItem("fraisReinscriptionEtablissement"' not in text:
                  text = text.replace(save_marker, save_code + save_marker, 1)

          # Load persisted global amounts with a backward-compatible fallback.
          load_marker = 'const tarificationChargee = serviceParametres.obtenirTarification()'
          if load_marker in text and 'localStorage.getItem("fraisReinscriptionEtablissement")' not in text:
              load_code = '''const fraisInscriptionGlobalCharge = Number(localStorage.getItem("fraisInscriptionEtablissement") || 0)\n      const fraisReinscriptionGlobalCharge = Number(localStorage.getItem("fraisReinscriptionEtablissement") || 0)\n'''
              text = text.replace(load_marker, load_marker + '\n      ' + load_code, 1)
              state_load = 'setPricing(Array.isArray(tarificationChargee) ? tarificationChargee : [])'
              text = text.replace(state_load, state_load + '\n      setFraisInscriptionEtablissement(fraisInscriptionGlobalCharge)\n      setFraisReinscriptionEtablissement(fraisReinscriptionGlobalCharge)', 1)

          page.write_text(text, encoding='utf-8')

          # Remove temporary files created during this correction attempt.
          for p in ['scripts/patch-settings-pricing.mjs', 'scripts/README.md', 'scripts/trigger.txt', 'scripts/trigger2.txt', 'scripts/trigger3.txt', 'scripts/trigger4.txt']:
              Path(p).unlink(missing_ok=True)

          Path('.github/workflows/apply-settings-pricing-correction.yml').unlink(missing_ok=True)
      - name: Commit correction
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'fix: make inscription and reinscription fees establishment-wide'
          git push origin HEAD:main
