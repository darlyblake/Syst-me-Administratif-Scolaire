name: Cleanup settings pricing
on:
  push:
    branches: [main]
  pull_request_target:
    types: [opened, synchronize]
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Remove per-level registration fields
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('app/ecole/settings/page.tsx')
          t = p.read_text(encoding='utf-8')
          # Remove the exact existing-level registration column.
          block = '''                            <div className="space-y-2">
                              <Label className="text-sm">Frais d'inscription (FCFA)</Label>
                              <Input
                                type="number"
                                value={niveau.fraisInscription || ""}
                                onChange={(e) =>
                                  handleTarificationTypeEcoleChange(
                                    typeEcole.typeEcole,
                                    niveau.niveau,
                                    "fraisInscription",
                                    Number.parseInt(e.target.value) || 0,
                                  )
                                }
                              />
                            </div>
'''
          if block in t:
              t = t.replace(block, '', 1)
          else:
              raise SystemExit('existing-level registration block not found')
          # Remove the exact new-level registration field.
          block2 = '''                          <div className="space-y-2">
                            <Label className="text-sm font-medium">Frais d'inscription</Label>
                            <Input
                              type="number"
                              value={nouveauxNiveaux[typeEcole.typeEcole]?.fraisInscription || ""}
                              onChange={(e) => setNouveauxNiveaux(prev => ({
                                ...prev,
                                [typeEcole.typeEcole]: { ...prev[typeEcole.typeEcole], fraisInscription: Number.parseInt(e.target.value) || 0 }
                              }))}
                              placeholder="0"
                            />
                          </div>
'''
          if block2 in t:
              t = t.replace(block2, '', 1)
          else:
              raise SystemExit('new-level registration block not found')
          t = t.replace(
              'disabled={!nouveauxNiveaux[typeEcole.typeEcole]?.nom || nouveauxNiveaux[typeEcole.typeEcole]?.fraisInscription <= 0 || nouveauxNiveaux[typeEcole.typeEcole]?.fraisScolariteAnnuelle <= 0}',
              'disabled={!nouveauxNiveaux[typeEcole.typeEcole]?.nom || nouveauxNiveaux[typeEcole.typeEcole]?.fraisScolariteAnnuelle <= 0}',
              1,
          )
          # Remove any separate class-level registration input if present.
          t = re.sub(
              r'<div className="space-y-2">\s*<Label[^>]*>Frais d\'inscription[^<]*</Label>\s*<Input\s+type="number"\s+value=\{fraisInscriptionNouvelle\}.*?</div>',
              '', t, count=1, flags=re.S)
          # Ensure new objects use the global registration amount.
          t = t.replace('fraisInscription: nouveauNiveau.fraisInscription,', 'fraisInscription: fraisInscriptionEtablissement,')
          t = t.replace('fraisInscription: fraisInscriptionNouvelle,', 'fraisInscription: fraisInscriptionEtablissement,')
          p.write_text(t, encoding='utf-8')
          Path('scripts/__settings_patch_trigger.txt').unlink(missing_ok=True)
          Path('.github/workflows/cleanup-settings-pricing.yml').unlink(missing_ok=True)
      - name: Commit correction to main
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'fix: remove per-level registration fields'
          git push origin HEAD:main
