name: Temporary classes frontend fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[classes-fix-bot]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply targeted classes fixes
        shell: python
        run: |
          from pathlib import Path
          p = Path('app/ecole/classes/page.tsx')
          s = p.read_text()
          original = s
          s = s.replace('const displayClasses = academicClasses.length ? academicClasses : classes', 'const displayClasses = classes.length ? classes : academicClasses')
          s = s.replace('const handleAjouterClasse = () => {', 'const handleAjouterClasse = async () => {')
          s = s.replace('      ajouter(nouvelleClasse)', '      await ajouter(nouvelleClasse)')
          s = s.replace('const handleModifierClasse = () => {', 'const handleModifierClasse = async () => {')
          s = s.replace('      modifier(editingClasse.id, editingClasse)', '      await modifier(editingClasse.id, editingClasse)')
          old_delete = '''const handleSupprimerClasse = (id: string) => {
    if (confirm("Êtes-vous sûr de vouloir supprimer cette classe ?")) {
      supprimer(id)
      toast.success("Classe supprimée")
    }
  }'''
          new_delete = '''const handleSupprimerClasse = async (id: string) => {
    if (!confirm("Êtes-vous sûr de vouloir supprimer cette classe ?")) return
    try {
      await supprimer(id)
      toast.success("Classe supprimée")
    } catch (erreur) {
      toast.error(erreur instanceof Error ? erreur.message : "Erreur lors de la suppression")
    }
  }'''
          s = s.replace(old_delete, new_delete)
          s = s.replace('value={nouvelleClasse.capacite}\n                  onChange={(e) => setNouvelleClasse({ ...nouvelleClasse, capacite: parseInt(e.target.value) || 30 })}', 'value={nouvelleClasse.capacite}\n                  onChange={(e) => setNouvelleClasse({ ...nouvelleClasse, capacite: e.target.value === "" ? "" : Number(e.target.value) })}')
          s = s.replace('value={editingClasse.capacite}\n                  onChange={(e) => setEditingClasse({ ...editingClasse, capacite: parseInt(e.target.value) || 30 })}', 'value={editingClasse.capacite}\n                  onChange={(e) => setEditingClasse({ ...editingClasse, capacite: e.target.value === "" ? 0 : Number(e.target.value) })}')
          if s == original:
              raise SystemExit('No classes page change matched')
          p.write_text(s)
      - name: Commit targeted fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/ecole/classes/page.tsx
          git diff --cached --check
          git commit -m 'fix(classes): persist async actions and editable capacity [classes-fix-bot]'
          git push
      - name: Remove temporary workflow
        if: success()
        run: |
          git rm .github/workflows/temporary-classes-fix.yml
          git commit -m 'chore: remove temporary classes fix workflow [classes-fix-bot]'
          git push
